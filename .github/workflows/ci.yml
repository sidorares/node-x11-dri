name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Build the addon and run the self-check. Hosted runners have no GPU and
  # no /dev/udmabuf, so test.js exercises the build, the dlopen probing and
  # the fd utilities, and reports the rest as skipped — which is exactly the
  # degradation contract this package promises on minimal hosts. The Mesa
  # runtime libraries are installed so probe() exercises real dlopen paths.
  #
  # macOS runs the same self-check for the other half of that contract: no
  # dma-buf ABI at all, so the addon must still build, load, and explain
  # itself rather than fail to install.
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        node-version: [18, 22, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Mesa runtime libraries (dlopen targets)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgbm1 libegl1 libgles2
      - run: npm install
      - run: npm test

  # The shipped declarations, compiled against a file that uses them. This is
  # the half `npm test` cannot do: that one checks the names still line up
  # with the addon, this one checks the signatures. Needs no GPU and no
  # native build, so it runs once rather than across the matrix.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run test:types

  # Same steps the release workflow uses to produce the prebuilt binaries
  # bundled into the npm tarball — run on every change so a broken pipeline
  # is discovered now, not at release time. Debian 11 (glibc 2.31) is the
  # compatibility baseline: binaries built there load on every current
  # distro. Official Node images link addons against libc only (distro
  # node-gyp setups may link libnode.so, which would not load elsewhere).
  prebuild-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    container: node:18-bullseye
    steps:
      - uses: actions/checkout@v7
      - run: npm install --build-from-source
      - name: Package the binary as a prebuild
        run: |
          target="linux-$(node -p process.arch)"
          mkdir -p "prebuilds/$target"
          cp build/Release/x11dri.node "prebuilds/$target/"
          strip "prebuilds/$target/x11dri.node"
          rm -rf build
          node -e "require('./index.js').probe()"   # loads via the prebuild
          node -e "const l=require('fs').readFileSync('prebuilds/'+process.argv[1]+'/x11dri.node'); if (l.includes('libnode.so')) { console.error('prebuild links libnode.so — not portable'); process.exit(1) }" "$target"
          ls -la "prebuilds/$target"
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux-${{ matrix.os == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }}
          path: prebuilds/
          if-no-files-found: error

  # The macOS prebuilds: darwin-arm64 built natively (macos-latest is Apple
  # Silicon), darwin-x64 cross-compiled on the same runner — the addon is
  # Node-API and macOS links addons with `-undefined dynamic_lookup`, so no
  # x86_64 Node is needed, only the toolchain. binding.gyp pins
  # MACOSX_DEPLOYMENT_TARGET=11.0, so both slices cover macOS 11+, and the
  # addon links nothing but libSystem/libc++, so one Node-API binary per
  # arch covers every supported Node.
  prebuild-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: npm install --build-from-source
      - name: Package the binaries as prebuilds (native arm64 + cross x64)
        run: |
          test "$(node -p process.arch)" = arm64   # the native build below is host-arch
          mkdir -p prebuilds/darwin-arm64 prebuilds/darwin-x64
          cp build/Release/x11dri.node prebuilds/darwin-arm64/
          npx node-gyp rebuild --arch=x64
          cp build/Release/x11dri.node prebuilds/darwin-x64/
          strip -x prebuilds/darwin-arm64/x11dri.node prebuilds/darwin-x64/x11dri.node   # -x: keep the exported symbols
          rm -rf build
          node -e "require('./index.js').probe()"    # loads via the arm64 prebuild
          # the x64 slice cannot be load-tested on this runner; hold it to the
          # static checks instead
          test "$(lipo -archs prebuilds/darwin-arm64/x11dri.node)" = arm64
          test "$(lipo -archs prebuilds/darwin-x64/x11dri.node)" = x86_64
          # A prebuild that pulled in a Node library, Homebrew, or XQuartz
          # would only load on the machine that built it.
          for f in prebuilds/darwin-arm64/x11dri.node prebuilds/darwin-x64/x11dri.node; do
            otool -L "$f"
            if otool -L "$f" | grep -qE 'libnode|/opt/homebrew|/usr/local/lib|/opt/X11'; then
              echo "prebuild links a non-system library — not portable"; exit 1
            fi
          done
          ls -la prebuilds/darwin-arm64 prebuilds/darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-darwin
          path: prebuilds/
          if-no-files-found: error
