name: Release Please

on:
  push:
    branches: [master]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # Build the prebuilt binaries bundled into the tarball, from the released
  # commit, on the glibc-2.31 baseline (Debian 11). One binary per arch is
  # enough: the addon is Node-API (ABI-stable across Node versions) and
  # links nothing but libc.
  prebuild-linux:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    container: node:18-bullseye
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: npm install --build-from-source
      - name: Package the binary as a prebuild
        run: |
          target="linux-$(node -p process.arch)"
          mkdir -p "prebuilds/$target"
          cp build/Release/x11dri.node "prebuilds/$target/"
          strip "prebuilds/$target/x11dri.node"
          rm -rf build
          node -e "require('./index.js').probe()"   # loads via the prebuild
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux-${{ matrix.os == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }}
          path: prebuilds/
          if-no-files-found: error

  # The Apple Silicon prebuild (macos-latest is arm64). macOS gets no GPU or
  # dma-buf support — there is none to have — but shipping the binary means
  # `npm install x11-dri` on a Mac needs no Xcode toolchain either, and
  # cross-platform code can require() the package unconditionally.
  prebuild-macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: npm install --build-from-source
      - name: Package the binary as a prebuild
        run: |
          target="darwin-$(node -p process.arch)"
          mkdir -p "prebuilds/$target"
          cp build/Release/x11dri.node "prebuilds/$target/"
          strip -x "prebuilds/$target/x11dri.node"
          rm -rf build
          node -e "require('./index.js').probe()"   # loads via the prebuild
          if otool -L "prebuilds/$target/x11dri.node" | grep -qE 'libnode|/opt/homebrew|/usr/local/lib|/opt/X11'; then
            echo "prebuild links a non-system library — not portable"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-darwin-arm64
          path: prebuilds/
          if-no-files-found: error

  # Publishes to npm via OIDC trusted publishing: no token secret anywhere.
  # npm's registry trusts this exact repo + workflow file (configured in the
  # package's Trusted Publisher settings on npmjs.com) and mints short-lived
  # credentials from the id-token below. Requires npm >= 11.5.1.
  # The tarball carries the prebuilds assembled above; `npm install x11-dri`
  # therefore needs no toolchain (and no network beyond the tarball) on
  # linux x64/arm64 glibc systems and on macOS 11+ Apple Silicon.
  publish:
    needs: [release-please, prebuild-linux, prebuild-macos]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: prebuilds/
          merge-multiple: true
      - name: Check every prebuild is in place
        run: |
          ls -laR prebuilds
          test -f prebuilds/linux-x64/x11dri.node
          test -f prebuilds/linux-arm64/x11dri.node
          test -f prebuilds/darwin-arm64/x11dri.node
      - run: npm publish
